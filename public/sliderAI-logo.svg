<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Piano/Book Element -->
  <path d="M300 250 H400 V350 H300 V250 Z" fill="#FFF5E6"/>
  <!-- Piano Keys -->
